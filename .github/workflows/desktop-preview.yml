name: Future PPT desktop preview
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  HYPERFRAMES_NO_TELEMETRY: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            packageArgs: --win zip --config.win.signAndEditExecutable=false
          - os: macos-latest
            packageArgs: --mac zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile --ignore-scripts --linker=hoisted
      - run: node node_modules/electron/install.js
      - run: bun run build
      - run: bun run --cwd packages/desktop typecheck
      - run: bun run --cwd packages/desktop test
      - run: bun run --cwd packages/desktop dist ${{ matrix.packageArgs }}
      - run: bun run --cwd packages/desktop test:smoke --packaged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: future-ppt-preview-${{ matrix.os }}
          path: |
            packages/desktop/release/*.zip
            packages/desktop/release/home.png
          if-no-files-found: error
