<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Future PPT · 播放器验证</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header>
      <strong><span class="logo">F</span> Future PPT</strong
      ><span class="muted">播放器 / 概念验证</span>
      <div class="actions">
        <button id="load">导入作品</button><button id="save">导出作品</button
        ><button id="fullscreen">全屏演示</button>
      </div>
    </header>
    <main>
      <aside>
        <p class="eyebrow">演示区间</p>
        <nav id="segments"></nav>
        <p class="eyebrow">验证场景</p>
        <p class="hint">对象在 50–70 秒持续运动，跨越 60 秒页面边界。</p>
        <button id="boundary">查看跨页运动 ↗</button>
        <div class="note">
          <span class="dot"></span> 一条总时间轴<br /><span class="muted"
            >页面切换保留对象实例</span
          >
        </div>
      </aside>
      <section class="workspace">
        <div class="caption"><span id="segment-name"></span><span>1280 × 720 / DOM</span></div>
        <div id="viewport"><div id="stage"></div></div>
        <div class="transport">
          <button id="play" class="primary">播放</button><button id="restart">回到开头</button
          ><output id="clock"></output
          ><label
            >速度
            <select id="speed">
              <option value="1">1×</option>
              <option value="4">4×</option>
              <option value="10">10×</option>
            </select></label
          >
        </div>
        <input
          id="scrubber"
          type="range"
          min="0"
          max="120000"
          step="1"
          value="3000"
          aria-label="全局时间"
        />
        <div class="ruler">
          <span>0 s</span><span>30 s</span><span>60 s · 页面边界</span><span>90 s</span
          ><span>120 s</span>
        </div>
        <div class="tracks">
          <span>traveler / 局部轨道</span>
          <div class="track"><div class="clip">50 s → 70 s</div></div>
        </div>
        <p id="status" role="status">点击对象查看状态；双击文字可编辑。空格播放 / 暂停。</p>
      </section>
      <aside class="inspector">
        <p class="eyebrow">对象检查器</p>
        <h2 id="selected-name">traveler</h2>
        <p class="hint">拖动默认修改整体位置，动画轨道保持相对偏移。</p>
        <label>布局 X <input id="layout-x" type="number" step="1" /></label
        ><label>布局 Y <input id="layout-y" type="number" step="1" /></label
        ><button id="nudge">整体向左 5 px</button
        ><label>文本 <textarea id="text" rows="3"></textarea></label>
        <hr />
        <p class="eyebrow">局部动画</p>
        <label>开始时间 / 秒 <input id="start" type="number" min="0" step="0.1" /></label
        ><label>播放时长 / 秒 <input id="duration" type="number" min="0.1" step="0.1" /></label
        ><label>终点 X 偏移 / px <input id="endpoint" type="number" step="1" /></label>
        <pre id="state"></pre>
        <div class="actions"><button id="undo">撤销</button><button id="redo">重做</button></div>
      </aside>
    </main>
    <input id="file" type="file" accept="application/json,.json" hidden />
    <script src="src/engine.js"></script>
    <script src="src/sample.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
