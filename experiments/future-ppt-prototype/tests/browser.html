<!doctype html><meta charset="utf-8" /><title>Browser checks</title>
<pre id="result">RUNNING</pre>
<iframe src="../index.html" width="1400" height="1000"></iframe>
<script>
  const frame = document.querySelector("iframe");
  frame.onload = () => {
    const results = [];
    const d = frame.contentDocument,
      w = frame.contentWindow;
    const check = (name, condition) => {
      if (!condition) throw new Error(name);
      results.push(name);
    };
    const seek = (t) => {
      d.getElementById("scrubber").value = t;
      d.getElementById("scrubber").dispatchEvent(new w.Event("input"));
    };
    try {
      check("all ten objects rendered", d.querySelectorAll(".object").length === 10);
      const traveler = d.querySelector('[data-id="traveler"]');
      seek(59999);
      const x1 = parseFloat(traveler.style.left);
      seek(60001);
      const x2 = parseFloat(traveler.style.left);
      check(
        "cross-page DOM instance retained",
        traveler === d.querySelector('[data-id="traveler"]'),
      );
      check("cross-page position continuous", Math.abs(x2 - x1 - 0.098) < 1e-8);
      seek(60000);
      check("second segment active", d.querySelector("nav .active").dataset.segment === "detail");
      d.getElementById("nudge").click();
      check(
        "nudge updates rendered position",
        parseFloat(d.querySelector('[data-id="traveler"]').style.left) === 585,
      );
      d.getElementById("undo").click();
      check(
        "undo restores position",
        parseFloat(d.querySelector('[data-id="traveler"]').style.left) === 590,
      );
      d.getElementById("redo").click();
      check(
        "redo reapplies position",
        parseFloat(d.querySelector('[data-id="traveler"]').style.left) === 585,
      );
      d.getElementById("undo").click();
      d.getElementById("endpoint").value = 1000;
      d.getElementById("endpoint").dispatchEvent(new w.Event("change"));
      seek(70000);
      check(
        "endpoint edit renders correctly",
        parseFloat(d.querySelector('[data-id="traveler"]').style.left) === 1100,
      );
      check(
        "image loads",
        d.querySelector("img").complete && d.querySelector("img").naturalWidth > 0,
      );
      document.getElementById("result").textContent =
        "PASS " + results.length + "\n" + results.join("\n");
    } catch (error) {
      document.getElementById("result").textContent =
        "FAIL " + error.stack + "\n" + results.join("\n");
    }
  };
</script>
